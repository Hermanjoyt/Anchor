<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANCHORS STREAM 24</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;
  scroll-behavior: smooth;

  /* BACKGROUND IMAGE */
  background-image: url("anchors-stream-24.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* DARK OVERLAY */
.bg-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

/* CONTENT BOX */
.content-box {
  background: rgba(0,0,0,0.7);
  padding: 25px;
  margin: 40px auto;
  border-radius: 15px;
  max-width: 900px;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

/* TITLE */
h1 {
  font-size: 2.8em;
  margin: 20px 0;
  text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
}

/* BUTTON */
button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  background: #ffd700;
  color: black;
  margin-top: 15px;
}
button:hover {
  box-shadow: 0 0 20px #0ff;
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="bg-overlay"></div>

<div class="content-box">
  <h1>✨ ANCHORS STREAM 24 ✨</h1>
  <p>(AURA MATTERS)</p>
  <button>ENTER STREAM</button>
</div>

</body>
</html>
